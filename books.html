<body>

<header class="site-header">
  <a class="brand" href="index.html"><img src="images/pazuju-logo.png" alt="Pazuju"></a>
  <nav>
    <a href="index.html">Home</a>
    <a href="play.html">Play</a>
    <a href="books.html">Books</a>
  </nav>
</header>

<main>
  <section class="hero" style="padding-top:0;">
    <h1>Books</h1>
    <p>Take Pazuju off the screen and onto paper.</p>
  </section>

  <section class="block">
    <div class="book-grid" id="bookGrid"></div>
  </section>
</main>

<footer class="site-footer">
  Pazuju &middot; a daily piece-placement puzzle
  <div class="footer-links">
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="privacy.html">Privacy Policy</a>
  </div>
</footer>

<script>
// Data-driven so adding another book later is just another object in this
// array - nothing else on the page needs to change.
const BOOKS = [
  {
    title: "Pazuju: The Evolution of the Number Game Is Here",
    author: "Jonathan Tillger",
    blurb: "The book behind the puzzle - the original print edition of Pazuju, from the creator of the daily online game.",
    url: "https://www.amazon.ca/Pazuju-evolution-number-game-here/dp/B0HJNNGW33",
    cover: "images/book-pazuju-cover.jpg",
  },
  {
    title: "Pazuju Grasshopper: 378 Jigsaw Sudoku Puzzles, Beginner to Expert",
    author: "Jonathan Tillger",
    blurb: "378 puzzles on a compact 6×6 grid across all four difficulty levels, with worked examples and full solutions at the back - a gentle way into logic puzzles.",
    url: "https://www.amazon.ca/Pazuju-Grasshopper-Puzzles-Beginner-Expert/dp/B0HNMFJKPF",
    cover: "images/book-pazuju-grasshopper-cover.jpg",
  },
  {
    title: "Pazuju Snake: 252 Jigsaw Sudoku Puzzles, Beginner to Expert",
    author: "Jonathan Tillger",
    blurb: "252 puzzles on a mid-size 8×8 grid across all four difficulty levels, with worked examples and full solutions at the back - for Sudoku fans who want something fresh.",
    url: "https://www.amazon.ca/dp/B0HNR6B41F",
    cover: "images/book-pazuju-snake-cover.jpg",
  },
  {
    title: "Pazuju Dragon: 144 Jigsaw Sudoku Puzzles, Beginner to Expert",
    author: "Jonathan Tillger",
    blurb: "144 puzzles on the full 10×10 grid across all four difficulty levels, with worked examples and full solutions at the back - the biggest challenge in the series.",
    url: "https://www.amazon.ca/Pazuju-Dragon-Evolution-Puzzles-Beginner/dp/B0HPD6V3QP",
    cover: "images/book-pazuju-dragon-cover.jpg",
  },
];

const bookGrid = document.getElementById("bookGrid");
BOOKS.forEach(book => {
  const card = document.createElement("div");
  card.className = "book-card";
  card.innerHTML = `
    ${book.cover ? `<img class="book-cover" src="${book.cover}" alt="${book.title} cover">` : ""}
    <div class="book-card-body">
      <h3>${book.title}</h3>
      <div class="book-author">by ${book.author}</div>
      <p>${book.blurb}</p>
      <a class="btn" href="${book.url}" target="_blank" rel="noopener">Buy on Amazon</a>
    </div>
  `;
  bookGrid.appendChild(card);
});
</script>
</body>
</html>

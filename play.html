<header class="site-header">

    <a href="play.html">Play</a>

</header>

<main>
  <section class="hero" style="padding-top:0;">
    <h1 id="dateHeading">Today&rsquo;s Puzzles</h1>
    <p id="dateSub">Pick a size to start playing.</p>
  </section>

  <div class="date-bar">
    <label for="archiveDate">Browse a different day:</label>
    <input type="date" id="archiveDate">
  </div>

  <div class="nickname-bar" id="nicknameBar">
    <span id="nicknameDisplay">Playing as <strong id="nicknameValue">Anonymous</strong> &middot; <button type="button" id="nicknameEditBtn" class="link-btn">change</button></span>
    <span id="nicknameEditForm" style="display:none;">
      <input type="text" id="nicknameInput" maxlength="20" placeholder="Your nickname">
      <button type="button" id="nicknameSaveBtn" class="btn secondary toolbar-btn">Save</button>
      <button type="button" id="nicknameCancelBtn" class="link-btn">Cancel</button>
    </span>
    <span id="streakBadge" class="streak-badge" style="display:none;">🔥 <span id="streakValue">0</span>-day streak</span>
  </div>

  <div id="loadError" class="error-msg" style="display:none;"></div>

  <section class="block" id="sizeSection" style="display:none;">
    <div class="size-grid" id="sizeGrid"></div>
  </section>

  <section class="game-area" id="gameArea">
    <div class="puzzle-meta" id="puzzleMeta"></div>
    <div class="puzzle-timer" id="puzzleTimer">⏱ 00:00</div>
    <div class="game-layout">
      <div id="board"></div>
      <div id="tray">
        <div class="tray-header">
          <h3>Pieces to place</h3>
          <div class="tray-cycle-btns">
            <button type="button" class="tray-cycle-btn" id="trayUpBtn" aria-label="Cycle pieces up" title="Cycle pieces up">▲</button>
            <button type="button" class="tray-cycle-btn" id="trayDownBtn" aria-label="Cycle pieces down" title="Cycle pieces down">▼</button>
          </div>
        </div>
      </div>
    </div>
    <div class="game-toolbar" id="gameToolbar">
      <button type="button" class="btn secondary toolbar-btn" id="undoBtn" title="Undo last move (Ctrl+Z)">↶ Undo</button>
      <button type="button" class="btn secondary toolbar-btn" id="skipAssemblyBtn">Skip assembly <span class="ad-tag" id="skipAssemblyAdTag">Watch ad</span></button>
      <button type="button" class="btn toolbar-btn" id="checkNumbersBtn">✓ Check numbers <span class="check-badge" id="checkBadge"></span></button>
      <button type="button" class="btn secondary toolbar-btn" id="leaderboardBtn">🏆 Leaderboard</button>
    </div>
    <div id="numberPad" class="number-pad"></div>
    <div class="status" id="status"></div>
    <div class="leaderboard-panel" id="leaderboardPanel">
      <div class="leaderboard-header">
        <h3 id="leaderboardTitle">Leaderboard</h3>
        <button type="button" class="link-btn" id="leaderboardCloseBtn">Close</button>
      </div>
      <p class="leaderboard-status" id="leaderboardStatus"></p>
      <ol class="leaderboard-list" id="leaderboardList"></ol>
    </div>
    <div class="share-panel" id="sharePanel">
      <p class="share-summary" id="shareSummary"></p>
      <div class="share-actions">
        <button type="button" class="btn toolbar-btn" id="shareBtn">📤 Share result</button>
        <a class="btn secondary toolbar-btn" id="shareTwitter" href="#" target="_blank" rel="noopener">Share on X</a>
        <a class="btn secondary toolbar-btn" id="shareFacebook" href="#" target="_blank" rel="noopener">Share on Facebook</a>
        <a class="btn secondary toolbar-btn" id="shareWhatsapp" href="#" target="_blank" rel="noopener">Share on WhatsApp</a>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  Pazuju &middot; a daily piece-placement puzzle
</footer>

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>

<script>
const sizeSection = document.getElementById("sizeSection");
const sizeGrid = document.getElementById("sizeGrid");
const gameArea = document.getElementById("gameArea");
const dateHeading = document.getElementById("dateHeading");
const dateSub = document.getElementById("dateSub");
const archiveDateInput = document.getElementById("archiveDate");
const loadError = document.getElementById("loadError");
const puzzleMeta = document.getElementById("puzzleMeta");

const boardEl = document.getElementById("board");
const trayEl = document.getElementById("tray");
const statusEl = document.getElementById("status");
const numberPadEl = document.getElementById("numberPad");
const puzzleTimerEl = document.getElementById("puzzleTimer");
const trayUpBtn = document.getElementById("trayUpBtn");
const trayDownBtn = document.getElementById("trayDownBtn");

trayUpBtn.addEventListener("click", () => game.cycleTrayUp());
trayDownBtn.addEventListener("click", () => game.cycleTrayDown());

// Nickname shown on leaderboard entries (see recordSolve() in
// pazuju-firebase.js) - stored on the player's Firebase user doc so it
// carries across sessions/devices once they're signed in as more than just
// an anonymous UID. Falls back to "Anonymous" until they set one.
const nicknameDisplay = document.getElementById("nicknameDisplay");
const nicknameValueEl = document.getElementById("nicknameValue");
const nicknameEditBtn = document.getElementById("nicknameEditBtn");
const nicknameEditForm = document.getElementById("nicknameEditForm");
const nicknameInput = document.getElementById("nicknameInput");
const nicknameSaveBtn = document.getElementById("nicknameSaveBtn");
const nicknameCancelBtn = document.getElementById("nicknameCancelBtn");

function closeNicknameEdit() {
  nicknameEditForm.style.display = "none";
  nicknameDisplay.style.display = "";
}

nicknameEditBtn.addEventListener("click", () => {
  nicknameInput.value = nicknameValueEl.textContent === "Anonymous" ? "" : nicknameValueEl.textContent;
  nicknameDisplay.style.display = "none";
  nicknameEditForm.style.display = "";
  nicknameInput.focus();
});

nicknameCancelBtn.addEventListener("click", closeNicknameEdit);

nicknameSaveBtn.addEventListener("click", async () => {
  const name = nicknameInput.value.trim().slice(0, 20);
  nicknameSaveBtn.disabled = true;
  try {
    await PazujuFirebase.setDisplayName(name);
    nicknameValueEl.textContent = name || "Anonymous";
  } catch (err) {
    console.error("Pazuju: failed to save nickname", err);
  } finally {
    nicknameSaveBtn.disabled = false;
    closeNicknameEdit();
  }
});

nicknameInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") nicknameSaveBtn.click();
  if (e.key === "Escape") closeNicknameEdit();
});

PazujuFirebase.getDisplayName().then((name) => {
  nicknameValueEl.textContent = name || "Anonymous";
}).catch((err) => console.error("Pazuju: failed to load nickname", err));

// Streak badge (see users/{uid} fields written by recordSolve() in
// pazuju-firebase.js) - a per-player stat shown next to the nickname, not
// tied to any one puzzle. currentStreak is only updated lazily on the next
// solve, so a streak the player let lapse would otherwise still show its old
// count until then - yesterdayLocalISO() lets the display itself treat a
// streak as broken (shows nothing) once its last solve is older than
// yesterday, without touching the stored value.
const streakBadge = document.getElementById("streakBadge");
const streakValueEl = document.getElementById("streakValue");

function yesterdayLocalISO() {
  const d = new Date();
  d.setDate(d.getDate() - 1);
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}

async function refreshStreakDisplay() {
  try {
    const stats = await PazujuFirebase.getStats();
    const alive = stats.lastSolvedDate === todayLocalISO() || stats.lastSolvedDate === yesterdayLocalISO();
    const streak = alive ? stats.currentStreak : 0;
    if (streak > 0) {
      streakValueEl.textContent = streak;
      streakBadge.title = `Best streak: ${stats.longestStreak} day${stats.longestStreak === 1 ? "" : "s"} · ${stats.totalSolved} solved`;
      streakBadge.style.display = "";
    } else {
      streakBadge.style.display = "none";
    }
  } catch (err) {
    console.error("Pazuju: failed to load streak", err);
  }
}

refreshStreakDisplay();

const gameToolbar = document.getElementById("gameToolbar");
const skipAssemblyBtn = document.getElementById("skipAssemblyBtn");
const undoBtn = document.getElementById("undoBtn");
const skipAssemblyAdTag = document.getElementById("skipAssemblyAdTag");
const checkNumbersBtn = document.getElementById("checkNumbersBtn");
const checkBadge = document.getElementById("checkBadge");

const sharePanel = document.getElementById("sharePanel");
const shareSummaryEl = document.getElementById("shareSummary");
const shareBtn = document.getElementById("shareBtn");
const shareTwitter = document.getElementById("shareTwitter");
const shareFacebook = document.getElementById("shareFacebook");
const shareWhatsapp = document.getElementById("shareWhatsapp");

const leaderboardBtn = document.getElementById("leaderboardBtn");
const leaderboardPanel = document.getElementById("leaderboardPanel");
const leaderboardTitle = document.getElementById("leaderboardTitle");
const leaderboardStatus = document.getElementById("leaderboardStatus");
const leaderboardList = document.getElementById("leaderboardList");
const leaderboardCloseBtn = document.getElementById("leaderboardCloseBtn");

function closeLeaderboard() {
  leaderboardPanel.classList.remove("visible");
}

leaderboardCloseBtn.addEventListener("click", closeLeaderboard);

// Fastest times for the exact puzzle currently open (this date + this size
// only, not a global ranking) - see getLeaderboard() in pazuju-firebase.js.
leaderboardBtn.addEventListener("click", async () => {
  const sizeInfo = manifest.sizes.find(s => s.key === selectedSizeKey);
  const dateLabel = currentPuzzleDate === todayLocalISO() ? "Today's" : formatDateLong(currentPuzzleDate) + "'s";
  leaderboardTitle.textContent = `${dateLabel} ${sizeInfo.creature} ${sizeInfo.label} Leaderboard`;
  leaderboardList.innerHTML = "";
  leaderboardStatus.textContent = "Loading…";
  leaderboardStatus.style.display = "block";
  leaderboardPanel.classList.add("visible");
  leaderboardBtn.disabled = true;

  const requestDate = currentPuzzleDate;
  const requestSizeKey = selectedSizeKey;
  try {
    const [entries, user] = await Promise.all([
      PazujuFirebase.getLeaderboard(requestDate, requestSizeKey),
      PazujuFirebase.ready,
    ]);
    // Stale response guard - the player may have switched puzzles while this was in flight.
    if (currentPuzzleDate !== requestDate || selectedSizeKey !== requestSizeKey) return;
    if (entries.length === 0) {
      leaderboardStatus.textContent = "No times recorded yet - be the first to solve it!";
      return;
    }
    leaderboardStatus.style.display = "none";
    entries.forEach((entry, i) => {
      const li = document.createElement("li");
      if (entry.uid === user.uid) li.classList.add("me");
      const rank = document.createElement("span");
      rank.className = "lb-rank";
      rank.textContent = i + 1;
      const name = document.createElement("span");
      name.className = "lb-name";
      name.textContent = entry.displayName || "Anonymous";
      const time = document.createElement("span");
      time.className = "lb-time";
      time.textContent = formatElapsed(entry.elapsedMs);
      li.append(rank, name, time);
      leaderboardList.appendChild(li);
    });
  } catch (err) {
    console.error("Pazuju: leaderboard load failed", err);
    if (currentPuzzleDate !== requestDate || selectedSizeKey !== requestSizeKey) return;
    leaderboardStatus.textContent = "Couldn't load the leaderboard right now.";
    leaderboardStatus.style.display = "block";
  } finally {
    leaderboardBtn.disabled = false;
  }
});

// No real ad network is hooked up yet (see PROJECT_NOTES.md) and there's no
// traffic to justify setting one up before analytics is in place. Ad-gated
// bonus unlocks are disabled for now - skip assembly is free, and check
// numbers caps out at the free allowance below with no ad option. Flip this
// back to true once a real ad SDK is wired into ads.js.
const ADS_ENABLED = false;
if (!ADS_ENABLED) skipAssemblyAdTag.style.display = "none";

// How many "check numbers" uses each board size gets for free per puzzle
// (harder/bigger sizes get more, since there's more to double-check).
// Anything beyond that requires watching a rewarded ad (see ads.js) - except
// Grasshopper, which caps out at its one free check with no ad option at all.
const SIZE_FREE_CHECKS = { "6x6": 1, "8x8": 2, "10x10": 3 };
const SIZE_ALLOWS_AD_CHECK = { "6x6": false, "8x8": true, "10x10": true };

function sizeAllowsAdCheck(sizeKey) {
  return ADS_ENABLED && (SIZE_ALLOWS_AD_CHECK[sizeKey] ?? true);
}

function checksStorageKey(date, sizeKey) {
  return `pazuju-checks-${date}-${sizeKey}`;
}

function getChecksUsed(date, sizeKey) {
  try {
    return parseInt(localStorage.getItem(checksStorageKey(date, sizeKey)) || "0", 10);
  } catch {
    return 0; // private browsing / storage disabled - just treat as unused each load
  }
}

function recordCheckUsed(date, sizeKey) {
  try {
    localStorage.setItem(checksStorageKey(date, sizeKey), String(getChecksUsed(date, sizeKey) + 1));
  } catch {
    /* storage unavailable - free checks just won't persist across reloads */
  }
}

function getRemainingFreeChecks(date, sizeKey) {
  const total = SIZE_FREE_CHECKS[sizeKey] ?? 0;
  return Math.max(0, total - getChecksUsed(date, sizeKey));
}

// Cross-fades the tray out and the number pad in once assembly finishes, so
// the "pieces to place" panel doesn't keep taking up screen space once it's
// empty - only #tray needs this helper since the engine already flips
// numberPad's display itself (see _renderNumberPad in pazuju-engine.js);
// here we just hold its opacity at 0 until the tray's fade-out finishes.
let wasReadyForNumbers = false;
const TRAY_FADE_MS = 400;

function fadeOutTray() {
  clearTimeout(trayEl._fadeTimeout);
  trayEl.style.opacity = "0";
  trayEl._fadeTimeout = setTimeout(() => { trayEl.style.display = "none"; }, TRAY_FADE_MS);
}

function fadeInTray() {
  clearTimeout(trayEl._fadeTimeout);
  trayEl.style.display = "";
  void trayEl.offsetWidth; // force reflow so the opacity transition below actually runs
  trayEl.style.opacity = "1";
}

// Keeps the toolbar in sync with the game's current phase - called by the
// engine itself after every render (see onStateChange below).
function updateToolbar(state) {
  if (!selectedSizeKey || !state) {
    gameToolbar.style.display = "none";
    return;
  }
  gameToolbar.style.display = "flex";
  undoBtn.disabled = !state.canUndo;
  skipAssemblyBtn.style.display = state.readyForNumbers ? "none" : "";
  checkNumbersBtn.style.display = state.readyForNumbers ? "" : "none";

  if (state.readyForNumbers !== wasReadyForNumbers) {
    wasReadyForNumbers = state.readyForNumbers;
    if (state.readyForNumbers) {
      numberPadEl.style.opacity = "0"; // engine just made it visible instantly - hold it hidden until the tray finishes fading
      fadeOutTray();
      setTimeout(() => { numberPadEl.style.opacity = "1"; }, TRAY_FADE_MS);
    } else {
      numberPadEl.style.opacity = "0";
      fadeInTray();
    }
  }

  const remaining = getRemainingFreeChecks(currentPuzzleDate, selectedSizeKey);
  const allowsAd = sizeAllowsAdCheck(selectedSizeKey);
  checkNumbersBtn.disabled = !state.hasUserValues || (remaining === 0 && !allowsAd);

  // Sync this puzzle's progress to Firebase on every render (debounced
  // per-puzzle inside saveProgress, so a burst of moves collapses into one
  // write) - see pazuju-firebase.js.
  PazujuFirebase.saveProgress(currentPuzzleDate, selectedSizeKey, { ...game.getState(), elapsedMs: currentElapsedMs() });

  if (remaining > 0) {
    checkBadge.textContent = String(remaining);
    checkNumbersBtn.title = `${remaining} free check${remaining === 1 ? "" : "s"} left today`;
  } else if (allowsAd) {
    checkBadge.textContent = "Ad";
    checkNumbersBtn.title = "Watch an ad to unlock another check";
  } else {
    checkBadge.textContent = "0";
    checkNumbersBtn.title = "No more checks available today";
  }
}

// Steps back one player action at a time (see undo() in pazuju-engine.js);
// the engine's re-render calls updateToolbar, which re-disables the button
// once history runs out.
undoBtn.addEventListener("click", () => game.undo());
document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === "z" && selectedSizeKey) {
    e.preventDefault();
    game.undo();
  }
});

skipAssemblyBtn.addEventListener("click", async () => {
  if (!ADS_ENABLED) {
    game.skipAssembly();
    return;
  }
  skipAssemblyBtn.disabled = true;
  const rewarded = await PazujuAds.watchRewardedAd();
  skipAssemblyBtn.disabled = false;
  if (rewarded) game.skipAssembly();
});

checkNumbersBtn.addEventListener("click", async () => {
  const remaining = getRemainingFreeChecks(currentPuzzleDate, selectedSizeKey);
  if (remaining > 0) {
    recordCheckUsed(currentPuzzleDate, selectedSizeKey);
    game.checkNumbers();
    updateToolbar({ readyForNumbers: true, hasUserValues: true });
    return;
  }
  if (!sizeAllowsAdCheck(selectedSizeKey)) return; // button is disabled in this state, but guard anyway
  checkNumbersBtn.disabled = true;
  const rewarded = await PazujuAds.watchRewardedAd();
  checkNumbersBtn.disabled = false;
  if (rewarded) game.checkNumbers();
});

// Puzzle timer - starts the moment a puzzle is opened (see selectSize) and
// runs continuously through assembly + number-filling until solved.
let timerInterval = null;
let timerStartMs = null;
let finalElapsedMs = null;

function formatElapsed(ms) {
  const totalSec = Math.max(0, Math.floor(ms / 1000));
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
}

function startTimer() {
  clearInterval(timerInterval);
  timerStartMs = Date.now();
  finalElapsedMs = null;
  puzzleTimerEl.textContent = "⏱ 00:00";
  timerInterval = setInterval(() => {
    puzzleTimerEl.textContent = "⏱ " + formatElapsed(Date.now() - timerStartMs);
  }, 1000);
}

function stopTimer() {
  clearInterval(timerInterval);
  timerInterval = null;
  if (timerStartMs !== null && finalElapsedMs === null) {
    finalElapsedMs = Date.now() - timerStartMs;
    puzzleTimerEl.textContent = "⏱ " + formatElapsed(finalElapsedMs);
  }
}

// Elapsed time for whatever's currently synced to Firebase (see
// PazujuFirebase.saveProgress calls) - the running time if still playing,
// the frozen final time once solved, or 0 before a puzzle's been opened.
function currentElapsedMs() {
  if (finalElapsedMs !== null) return finalElapsedMs;
  if (timerStartMs !== null) return Date.now() - timerStartMs;
  return 0;
}

// Builds the shareable result summary - puzzle identity + time only, no
// solution/spoiler content. url carries ?date= so a friend opening the link
// lands straight on the same day's puzzles (see init()'s query handling).
function buildShareText() {
  const sizeInfo = manifest.sizes.find(s => s.key === selectedSizeKey);
  const puzzle = sizePuzzles[selectedSizeKey];
  const timeStr = formatElapsed(finalElapsedMs ?? 0);
  const dateLabel = currentPuzzleDate === todayLocalISO() ? "today's" : formatDateLong(currentPuzzleDate);
  const url = `${location.origin}${location.pathname}?date=${currentPuzzleDate}`;
  const text = `Pazuju - solved ${dateLabel} ${sizeInfo.creature} ${sizeInfo.label} (${difficultyCategory(puzzle.difficulty)}) in ${timeStr}! 🎉`;
  return { text, url };
}

function showShareResult() {
  const { text, url } = buildShareText();
  shareSummaryEl.textContent = text;
  shareTwitter.href = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(url)}`;
  shareFacebook.href = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}`;
  shareWhatsapp.href = `https://wa.me/?text=${encodeURIComponent(text + " " + url)}`;
  sharePanel.classList.add("visible");
}

// Prefers the native share sheet (covers social apps and direct-to-friend
// messaging in one) and falls back to copying the result text for browsers
// without Web Share support (most desktop browsers).
shareBtn.addEventListener("click", async () => {
  const { text, url } = buildShareText();
  if (navigator.share) {
    try { await navigator.share({ title: "Pazuju", text, url }); } catch { /* user cancelled - not an error */ }
    return;
  }
  const original = shareBtn.textContent;
  try {
    await navigator.clipboard.writeText(`${text}\n${url}`);
    shareBtn.textContent = "Copied!";
  } catch {
    shareBtn.textContent = "Copy failed - select text above";
  }
  setTimeout(() => { shareBtn.textContent = original; }, 1800);
});

function handleSolved() {
  stopTimer();
  launchFireworks();
  showShareResult();
  // Flush immediately rather than relying on the debounced save in
  // updateToolbar, and record the leaderboard entry + streak update - see
  // recordSolve() in pazuju-firebase.js.
  PazujuFirebase.flushProgress(currentPuzzleDate, selectedSizeKey, { ...game.getState(), elapsedMs: finalElapsedMs ?? 0 });
  PazujuFirebase.recordSolve({ date: currentPuzzleDate, sizeKey: selectedSizeKey, elapsedMs: finalElapsedMs ?? 0 })
    .then(refreshStreakDisplay)
    .catch((err) => console.error("Pazuju: recordSolve failed", err));
}

// Fits the board to the viewport instead of always rendering at the
// desktop-sized 520px default, which overflowed narrower phone screens.
// 520 stays the ceiling on wide screens so desktop is unaffected.
function computeBoardMaxPx() {
  const available = window.innerWidth - 64; // rough allowance for main's side padding + breathing room
  return Math.max(180, Math.min(520, available));
}

const game = new PazujuGame({ boardEl, trayEl, statusEl, numberPadEl, boardMaxPx: computeBoardMaxPx(), onSolved: handleSolved, onStateChange: updateToolbar });

let resizeTimer = null;
function handleViewportResize() {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => game.setBoardMaxPx(computeBoardMaxPx()), 150);
}
window.addEventListener("resize", handleViewportResize);
window.addEventListener("orientationchange", handleViewportResize);

// Bypass the debounced save when the tab is about to go away, so the
// player's latest move isn't lost if it hasn't fired yet.
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden" && selectedSizeKey && currentPuzzleDate) {
    PazujuFirebase.flushProgress(currentPuzzleDate, selectedSizeKey, { ...game.getState(), elapsedMs: currentElapsedMs() });
  }
});

function todayLocalISO() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}

function formatDateLong(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(undefined, { weekday: "long", year: "numeric", month: "long", day: "numeric" });
}

// Difficulty is a property of the puzzle itself (how many solving rules it
// takes), not of the board size - each size can land at any tier on a given day.
function difficultyCategory(value) {
  if (value == null) return "?";
  if (value < 2.0) return "Beginner";
  if (value < 3.0) return "Intermediate";
  if (value < 6.0) return "Advanced";
  return "Expert";
}

function showError(message) {
  loadError.textContent = message;
  loadError.style.display = "block";
  sizeSection.style.display = "none";
  gameArea.classList.remove("active");
}

async function fetchManifest() {
  const res = await fetch("puzzles/manifest.json");
  if (!res.ok) throw new Error(`Could not load puzzles/manifest.json (${res.status})`);
  return res.json();
}

async function fetchPuzzle(date, sizeInfo) {
  const res = await fetch(`puzzles/${date}/${sizeInfo.file}`);
  if (!res.ok) throw new Error(`Could not load puzzles/${date}/${sizeInfo.file} (${res.status})`);
  const xmlText = await res.text();
  return parsePazujuXML(xmlText, `${date}:${sizeInfo.key}`);
}

let manifest = null;
let releasedDates = [];
let sizePuzzles = {}; // sizeKey -> parsed puzzle for the currently viewed date
let selectedSizeKey = null;
let currentPuzzleDate = null;

async function loadDate(date) {
  loadError.style.display = "none";
  gameArea.classList.remove("active");
  sizeSection.style.display = "none";
  selectedSizeKey = null;
  currentPuzzleDate = date;
  stopTimer();
  sharePanel.classList.remove("visible");
  closeLeaderboard();

  dateHeading.textContent = date === todayLocalISO() ? "Today’s Puzzles" : "Puzzles for " + formatDateLong(date);
  dateSub.textContent = "Pick a size to start playing.";

  sizePuzzles = {};
  try {
    for (const sizeInfo of manifest.sizes) {
      sizePuzzles[sizeInfo.key] = await fetchPuzzle(date, sizeInfo);
    }
  } catch (err) {
    showError(err.message + (location.protocol === "file:" ? " (this page needs to be served over http, not opened directly as a file)" : ""));
    console.error(err);
    return;
  }

  sizeGrid.innerHTML = "";
  manifest.sizes.forEach(sizeInfo => {
    const puzzle = sizePuzzles[sizeInfo.key];
    const card = document.createElement("div");
    card.className = "size-card";
    card.innerHTML = `<img class="plaque" src="${sizeInfo.icon}" alt="${sizeInfo.creature}"><div class="dims">${sizeInfo.label}</div><div class="difficulty">${difficultyCategory(puzzle.difficulty)}</div>`;
    card.addEventListener("click", () => selectSize(sizeInfo.key, card));
    sizeGrid.appendChild(card);
  });
  sizeSection.style.display = "block";
}

function selectSize(sizeKey, cardEl) {
  selectedSizeKey = sizeKey;
  [...sizeGrid.children].forEach(c => c.classList.remove("selected"));
  cardEl.classList.add("selected");

  const puzzle = sizePuzzles[sizeKey];
  const sizeInfo = manifest.sizes.find(s => s.key === sizeKey);
  puzzleMeta.textContent = `${sizeInfo.creature} ${sizeInfo.label} · ${difficultyCategory(puzzle.difficulty)} · values ${puzzle.valueMin}–${puzzle.valueMax}`;
  sharePanel.classList.remove("visible");
  closeLeaderboard();
  wasReadyForNumbers = false;
  fadeInTray();
  numberPadEl.style.opacity = "0";
  game.loadPuzzle(puzzle);
  startTimer();
  gameArea.classList.add("active");
  gameArea.scrollIntoView({ behavior: "smooth", block: "start" });

  // Resume any progress synced from a previous session/device for this exact
  // puzzle. The read is async, so guard against a stale response landing
  // after the player has already navigated to a different size/date.
  const requestDate = currentPuzzleDate;
  PazujuFirebase.loadProgress(requestDate, sizeKey).then((saved) => {
    if (!saved) return;
    if (currentPuzzleDate !== requestDate || selectedSizeKey !== sizeKey) return;
    game.restoreState(saved);
    if (saved.elapsedMs) timerStartMs = Date.now() - saved.elapsedMs;
  }).catch((err) => console.error("Pazuju: progress load failed", err));
}

async function init() {
  try {
    manifest = await fetchManifest();
  } catch (err) {
    showError(err.message + (location.protocol === "file:" ? " (this page needs to be served over http, not opened directly as a file)" : ""));
    console.error(err);
    return;
  }

  const today = todayLocalISO();
  releasedDates = manifest.dates.filter(d => d <= today).sort();

  if (releasedDates.length === 0) {
    showError("No puzzles have been released yet. Check back soon.");
    return;
  }

  // A shared result link carries ?date=YYYY-MM-DD (see buildShareText) so the
  // friend opening it lands straight on that day's puzzles instead of today's.
  const requestedDate = new URLSearchParams(location.search).get("date");
  const currentDate = (requestedDate && releasedDates.includes(requestedDate))
    ? requestedDate
    : releasedDates[releasedDates.length - 1];
  archiveDateInput.min = releasedDates[0];
  archiveDateInput.max = releasedDates[releasedDates.length - 1];
  archiveDateInput.value = currentDate;

  archiveDateInput.addEventListener("change", () => {
    const chosen = archiveDateInput.value;
    if (!releasedDates.includes(chosen)) {
      showError("No puzzles were released on that date. Pick a highlighted date instead.");
      return;
    }
    loadDate(chosen);
  });

  await loadDate(currentDate);
}

init();
</script>

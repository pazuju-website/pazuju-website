<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play Pazuju</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
<link rel="icon" href="images/pazuju-logo.png">
</head>
<body>

<header class="site-header">
  <a class="brand" href="index.html"><img src="images/pazuju-logo.png" alt="Pazuju"></a>
  <nav>
    <a href="index.html">Home</a>
    <a href="play.html">Play</a>
    <a href="books.html">Books</a>
  </nav>
</header>

<main>
  <section class="hero" style="padding-top:0;">
    <h1 id="dateHeading">Today&rsquo;s Puzzles</h1>
    <p id="dateSub">Pick a size to start playing.</p>
  </section>

  <div class="date-bar">
    <label for="archiveDate">Browse a different day:</label>
    <input type="date" id="archiveDate">
  </div>

  <div id="loadError" class="error-msg" style="display:none;"></div>

  <section class="block" id="sizeSection" style="display:none;">
    <div class="size-grid" id="sizeGrid"></div>
  </section>

  <section class="game-area" id="gameArea">
    <div class="puzzle-meta" id="puzzleMeta"></div>
    <div class="game-layout">
      <div id="board"></div>
      <div id="tray"><h3>Pieces to place</h3></div>
    </div>
    <div class="game-toolbar" id="gameToolbar">
      <button type="button" class="btn secondary toolbar-btn" id="skipAssemblyBtn">Skip assembly <span class="ad-tag" id="skipAssemblyAdTag">Watch ad</span></button>
      <button type="button" class="btn toolbar-btn" id="checkNumbersBtn">✓ Check numbers <span class="check-badge" id="checkBadge"></span></button>
    </div>
    <div id="numberPad" class="number-pad"></div>
    <div class="status" id="status"></div>
  </section>
</main>

<footer class="site-footer">
  Pazuju &middot; a daily piece-placement puzzle
</footer>

<script src="Online Game/js/pazuju-xml-loader.js"></script>
<script src="Online Game/js/pazuju-engine.js"></script>
<script src="Online Game/js/celebration.js"></script>
<script src="Online Game/js/ads.js"></script>
<script>
const sizeSection = document.getElementById("sizeSection");
const sizeGrid = document.getElementById("sizeGrid");
const gameArea = document.getElementById("gameArea");
const dateHeading = document.getElementById("dateHeading");
const dateSub = document.getElementById("dateSub");
const archiveDateInput = document.getElementById("archiveDate");
const loadError = document.getElementById("loadError");
const puzzleMeta = document.getElementById("puzzleMeta");

const boardEl = document.getElementById("board");
const trayEl = document.getElementById("tray");
const statusEl = document.getElementById("status");
const numberPadEl = document.getElementById("numberPad");

const gameToolbar = document.getElementById("gameToolbar");
const skipAssemblyBtn = document.getElementById("skipAssemblyBtn");
const skipAssemblyAdTag = document.getElementById("skipAssemblyAdTag");
const checkNumbersBtn = document.getElementById("checkNumbersBtn");
const checkBadge = document.getElementById("checkBadge");

// No real ad network is hooked up yet (see PROJECT_NOTES.md) and there's no
// traffic to justify setting one up before analytics is in place. Ad-gated
// bonus unlocks are disabled for now - skip assembly is free, and check
// numbers caps out at the free allowance below with no ad option. Flip this
// back to true once a real ad SDK is wired into ads.js.
const ADS_ENABLED = false;
if (!ADS_ENABLED) skipAssemblyAdTag.style.display = "none";

// How many "check numbers" uses each board size gets for free per puzzle
// (harder/bigger sizes get more, since there's more to double-check).
// Anything beyond that requires watching a rewarded ad (see ads.js) - except
// Grasshopper, which caps out at its one free check with no ad option at all.
const SIZE_FREE_CHECKS = { "6x6": 1, "8x8": 2, "10x10": 3 };
const SIZE_ALLOWS_AD_CHECK = { "6x6": false, "8x8": true, "10x10": true };

function sizeAllowsAdCheck(sizeKey) {
  return ADS_ENABLED && (SIZE_ALLOWS_AD_CHECK[sizeKey] ?? true);
}

function checksStorageKey(date, sizeKey) {
  return `pazuju-checks-${date}-${sizeKey}`;
}

function getChecksUsed(date, sizeKey) {
  try {
    return parseInt(localStorage.getItem(checksStorageKey(date, sizeKey)) || "0", 10);
  } catch {
    return 0; // private browsing / storage disabled - just treat as unused each load
  }
}

function recordCheckUsed(date, sizeKey) {
  try {
    localStorage.setItem(checksStorageKey(date, sizeKey), String(getChecksUsed(date, sizeKey) + 1));
  } catch {
    /* storage unavailable - free checks just won't persist across reloads */
  }
}

function getRemainingFreeChecks(date, sizeKey) {
  const total = SIZE_FREE_CHECKS[sizeKey] ?? 0;
  return Math.max(0, total - getChecksUsed(date, sizeKey));
}

// Keeps the toolbar in sync with the game's current phase - called by the
// engine itself after every render (see onStateChange below).
function updateToolbar(state) {
  if (!selectedSizeKey || !state) {
    gameToolbar.style.display = "none";
    return;
  }
  gameToolbar.style.display = "flex";
  skipAssemblyBtn.style.display = state.readyForNumbers ? "none" : "";
  checkNumbersBtn.style.display = state.readyForNumbers ? "" : "none";

  const remaining = getRemainingFreeChecks(currentPuzzleDate, selectedSizeKey);
  const allowsAd = sizeAllowsAdCheck(selectedSizeKey);
  checkNumbersBtn.disabled = !state.hasUserValues || (remaining === 0 && !allowsAd);

  if (remaining > 0) {
    checkBadge.textContent = String(remaining);
    checkNumbersBtn.title = `${remaining} free check${remaining === 1 ? "" : "s"} left today`;
  } else if (allowsAd) {
    checkBadge.textContent = "Ad";
    checkNumbersBtn.title = "Watch an ad to unlock another check";
  } else {
    checkBadge.textContent = "0";
    checkNumbersBtn.title = "No more checks available today";
  }
}

skipAssemblyBtn.addEventListener("click", async () => {
  if (!ADS_ENABLED) {
    game.skipAssembly();
    return;
  }
  skipAssemblyBtn.disabled = true;
  const rewarded = await PazujuAds.watchRewardedAd();
  skipAssemblyBtn.disabled = false;
  if (rewarded) game.skipAssembly();
});

checkNumbersBtn.addEventListener("click", async () => {
  const remaining = getRemainingFreeChecks(currentPuzzleDate, selectedSizeKey);
  if (remaining > 0) {
    recordCheckUsed(currentPuzzleDate, selectedSizeKey);
    game.checkNumbers();
    updateToolbar({ readyForNumbers: true, hasUserValues: true });
    return;
  }
  if (!sizeAllowsAdCheck(selectedSizeKey)) return; // button is disabled in this state, but guard anyway
  checkNumbersBtn.disabled = true;
  const rewarded = await PazujuAds.watchRewardedAd();
  checkNumbersBtn.disabled = false;
  if (rewarded) game.checkNumbers();
});

const game = new PazujuGame({ boardEl, trayEl, statusEl, numberPadEl, onSolved: () => launchFireworks(), onStateChange: updateToolbar });

function todayLocalISO() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}

function formatDateLong(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(undefined, { weekday: "long", year: "numeric", month: "long", day: "numeric" });
}

// Difficulty is a property of the puzzle itself (how many solving rules it
// takes), not of the board size - each size can land at any tier on a given day.
function difficultyCategory(value) {
  if (value == null) return "?";
  if (value < 2.0) return "Beginner";
  if (value < 3.0) return "Intermediate";
  if (value < 6.0) return "Advanced";
  return "Expert";
}

function showError(message) {
  loadError.textContent = message;
  loadError.style.display = "block";
  sizeSection.style.display = "none";
  gameArea.classList.remove("active");
}

async function fetchManifest() {
  const res = await fetch("puzzles/manifest.json");
  if (!res.ok) throw new Error(`Could not load puzzles/manifest.json (${res.status})`);
  return res.json();
}

async function fetchPuzzle(date, sizeInfo) {
  const res = await fetch(`puzzles/${date}/${sizeInfo.file}`);
  if (!res.ok) throw new Error(`Could not load puzzles/${date}/${sizeInfo.file} (${res.status})`);
  const xmlText = await res.text();
  return parsePazujuXML(xmlText, `${date}:${sizeInfo.key}`);
}

let manifest = null;
let releasedDates = [];
let sizePuzzles = {}; // sizeKey -> parsed puzzle for the currently viewed date
let selectedSizeKey = null;
let currentPuzzleDate = null;

async function loadDate(date) {
  loadError.style.display = "none";
  gameArea.classList.remove("active");
  sizeSection.style.display = "none";
  selectedSizeKey = null;
  currentPuzzleDate = date;

  dateHeading.textContent = date === todayLocalISO() ? "Today’s Puzzles" : "Puzzles for " + formatDateLong(date);
  dateSub.textContent = "Pick a size to start playing.";

  sizePuzzles = {};
  try {
    for (const sizeInfo of manifest.sizes) {
      sizePuzzles[sizeInfo.key] = await fetchPuzzle(date, sizeInfo);
    }
  } catch (err) {
    showError(err.message + (location.protocol === "file:" ? " (this page needs to be served over http, not opened directly as a file)" : ""));
    console.error(err);
    return;
  }

  sizeGrid.innerHTML = "";
  manifest.sizes.forEach(sizeInfo => {
    const puzzle = sizePuzzles[sizeInfo.key];
    const card = document.createElement("div");
    card.className = "size-card";
    card.innerHTML = `<img class="plaque" src="${sizeInfo.icon}" alt="${sizeInfo.creature}"><div class="dims">${sizeInfo.label}</div><div class="difficulty">${difficultyCategory(puzzle.difficulty)}</div>`;
    card.addEventListener("click", () => selectSize(sizeInfo.key, card));
    sizeGrid.appendChild(card);
  });
  sizeSection.style.display = "block";
}

function selectSize(sizeKey, cardEl) {
  selectedSizeKey = sizeKey;
  [...sizeGrid.children].forEach(c => c.classList.remove("selected"));
  cardEl.classList.add("selected");

  const puzzle = sizePuzzles[sizeKey];
  const sizeInfo = manifest.sizes.find(s => s.key === sizeKey);
  puzzleMeta.textContent = `${sizeInfo.creature} ${sizeInfo.label} · ${difficultyCategory(puzzle.difficulty)} · values ${puzzle.valueMin}–${puzzle.valueMax}`;
  game.loadPuzzle(puzzle);
  gameArea.classList.add("active");
  gameArea.scrollIntoView({ behavior: "smooth", block: "start" });
}

async function init() {
  try {
    manifest = await fetchManifest();
  } catch (err) {
    showError(err.message + (location.protocol === "file:" ? " (this page needs to be served over http, not opened directly as a file)" : ""));
    console.error(err);
    return;
  }

  const today = todayLocalISO();
  releasedDates = manifest.dates.filter(d => d <= today).sort();

  if (releasedDates.length === 0) {
    showError("No puzzles have been released yet. Check back soon.");
    return;
  }

  const currentDate = releasedDates[releasedDates.length - 1];
  archiveDateInput.min = releasedDates[0];
  archiveDateInput.max = currentDate;
  archiveDateInput.value = currentDate;

  archiveDateInput.addEventListener("change", () => {
    const chosen = archiveDateInput.value;
    if (!releasedDates.includes(chosen)) {
      showError("No puzzles were released on that date. Pick a highlighted date instead.");
      return;
    }
    loadDate(chosen);
  });

  await loadDate(currentDate);
}

init();
</script>
</body>
</html>
